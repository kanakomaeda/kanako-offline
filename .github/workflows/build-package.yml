name: Build Kanako Offline Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Locate offline app source
        shell: bash
        run: |
          if [[ -s Kanako_Offline_Workbench.html ]]; then
            cp Kanako_Offline_Workbench.html /tmp/kanako-app.html
          elif [[ -s index.html ]]; then
            cp index.html /tmp/kanako-app.html
          else
            echo "Upload index.html or Kanako_Offline_Workbench.html to the repository root." >&2
            exit 1
          fi
      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/kanako-app.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline JavaScript was found in the HTML file.');
          scripts.forEach((match, index) => {
            new Function(match[1]);
            console.log('JavaScript block ' + (index + 1) + ' parsed successfully.');
          });
          NODE
      - name: Package offline app
        run: |
          mkdir -p dist
          cp /tmp/kanako-app.html dist/Kanako_Offline_Workbench.html
          cp README.md dist/README.md
          cd dist
          zip -9 Kanako_Offline_Workbench_Package.zip Kanako_Offline_Workbench.html README.md
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: kanako-offline-package
          path: dist/Kanako_Offline_Workbench_Package.zip
          if-no-files-found: error
          retention-days: 30
