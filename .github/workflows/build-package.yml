name: Build Kanako Offline Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Locate offline app source
        shell: bash
        run: |
          if [[ -s index.html ]]; then
            cp index.html /tmp/kanako-app.html
          elif [[ -s Kanako_Offline_Workbench.html ]]; then
            cp Kanako_Offline_Workbench.html /tmp/kanako-app.html
          else
            echo "Upload index.html or Kanako_Offline_Workbench.html to the repository root." >&2
            exit 1
          fi
      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('/tmp/kanako-app.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts were found in the HTML file.');
          let checked = 0;
          scripts.forEach((match, index) => {
            const attrs = match[1] || '';
            if (/\\btype\\s*=\\s*["']?importmap["']?/i.test(attrs)) {
              console.log('Skipping JSON import map ' + (index + 1) + '.');
              return;
            }
            const isModule = /\\btype\\s*=\\s*["']module["']/i.test(attrs);
            const path = '/tmp/kanako-package-inline-' + index + (isModule ? '.mjs' : '.js');
            fs.writeFileSync(path, match[2]);
            const result = spawnSync(process.execPath, ['--check', path], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
            checked++;
            console.log('JavaScript block ' + (index + 1) + ' parsed successfully.');
          });
          if (!checked) throw new Error('No JavaScript blocks were available to validate.');
          NODE
      - name: Package offline app
        run: |
          mkdir -p dist
          cp /tmp/kanako-app.html dist/Kanako_Offline_Workbench.html
          cp README.md dist/README.md
          cd dist
          zip -9 Kanako_Offline_Workbench_Package.zip Kanako_Offline_Workbench.html README.md
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: kanako-offline-package
          path: dist/Kanako_Offline_Workbench_Package.zip
          if-no-files-found: error
          retention-days: 30
