name: Deploy Kanako Progress Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts were found in index.html.');
          let checked = 0;
          scripts.forEach((match, index) => {
            const attrs = match[1] || '';
            if (/\btype\s*=\s*["']?importmap["']?/i.test(attrs)) {
              console.log('Skipping JSON import map ' + (index + 1) + '.');
              return;
            }
            const isModule = /\btype\s*=\s*["']module["']/i.test(attrs);
            const path = '/tmp/kanako-inline-' + index + (isModule ? '.mjs' : '.js');
            fs.writeFileSync(path, match[2]);
            const result = spawnSync(process.execPath, ['--check', path], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
            checked++;
            console.log('JavaScript block ' + (index + 1) + ' parsed successfully.');
          });
          if (!checked) throw new Error('No JavaScript blocks were available to validate.');
          NODE

      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          cat > _site/README-ONLINE.txt <<'EOF'
          Kanako Progress Hub - online static version

          The frontend connects to the existing Supabase shared workspace through the kanako-api Edge Function.
          Records and private PDF/MP4 evidence files sync through the authenticated backend for authorized users.
          Browser-local storage is used for session credentials, device identity, and temporary cache only.
          Cross-device access may require Superuser approval of the registered device.
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
